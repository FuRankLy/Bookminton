<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookminton</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 12px; width: 320px; }
      h1 { font-size: 16px; margin: 0 0 8px; }
      fieldset { border: 1px solid #8883; border-radius: 8px; padding: 8px 10px; margin: 10px 0; }
      label { display: block; margin: 6px 0 2px; font-size: 12px; }
      input, select { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px; border: 1px solid #ccc; }
  .input-eye { position: relative; }
  .input-eye input { padding-right: 34px; }
  .eye-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; cursor: pointer; padding: 2px; line-height: 1; font-size: 14px; opacity: .7; }
  .eye-btn:hover { opacity: 1; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
      button { padding: 6px 10px; border-radius: 6px; border: 1px solid #9995; cursor: pointer; }
      .note { font-size: 11px; color: #666; }
  .status { margin-top: 10px; font-size: 12px; padding: 8px; border-radius: 6px; border: 1px solid #9994; }
  .status.success { background: #16a34a22; border-color: #16a34a55; }
  .status.error { background: #dc262622; border-color: #dc262655; }
    </style>
  </head>
  <body>
    <!-- Popup title with Pending Booking button at top-right -->
    <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
      <h1 style="margin:0;">Bookminton</h1>
      <button id="pendingBookings" title="View or cancel pending bookings" style="font-size:12px; padding:4px 8px;">Pending Booking</button>
    </div>
    <fieldset>
      <!-- Login credentials used by the background booking flow -->
      <legend>Login</legend>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="name@example.com" />
      <label for="password">Password</label>
      <div class="input-eye">
        <input id="password" type="password" autocomplete="current-password" />
        <button id="showPassword" type="button" class="eye-btn" aria-label="Hold to show password" title="Hold to show">👁</button>
      </div>
    </fieldset>

    <fieldset>
      <!-- Booking parameters sent to the site when "Book" is pressed -->
      <legend>Booking</legend>
      <div class="row">
        <div>
          <label for="bookingDate">Date</label>
          <input id="bookingDate" type="date" />
        </div>
        <div>
          <label for="timeStart">Start</label>
          <input id="timeStart" type="time" value="19:00" />
        </div>
      </div>
      <div class="row">
        <div>
          <label for="duration">Duration (mins)</label>
          <input id="duration" type="number" min="30" step="30" value="60" />
        </div>
        <div>
          <label for="courtNumber">Court number</label>
          <select id="courtNumber">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>
        </div>
      </div>
      <label for="autoBook">
        <input id="autoBook" type="checkbox" /> Enable auto-book on release
      </label>
  <div class="note">Times and availability depend on the AKL Badminton Platform. This tool can be disabled anytime.</div>
    </fieldset>

    <div class="buttons">
      <!-- Attempt to enable next-day navigation on the booking page -->
      <button id="overrideNextDay" title="Temporarily override next-day restriction">Override next day</button>
  <!-- Check availability for selected date/time without booking -->
  <button id="checkAvailability" title="Check which courts are free for the selected time">Check</button>
      <!-- Save settings and trigger a booking request -->
      <button id="save">Book</button>
      <!-- Try to book; if blocked, schedule a pending job -->
      <button id="reserve">Reserve</button>
    </div>

  <!-- Area to display booking result messages -->
  <div id="status" class="status" role="status" aria-live="polite" hidden></div>

  <!-- Pending bookings modal is dynamically injected by pending.js -->

    <script src="popup.js" type="module"></script>
  </body>
</html>
